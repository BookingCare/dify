# Chat page styling injected by Dify nginx:
# - Title & Favicon: BookingCare
# - Sidebar logo padding: 14%
# - Chat message avatars hidden
# - Medical disclaimer below input box
# - Hide per-answer stats (latency, tokens, token cost)
# - Hide "POWERED BY Dify" / "ĐƯỢC CUNG CẤP BỞI Dify"
# - Hide workflow process steps (e.g. "Lưu vào hội thoại", "tra_cuu")
# - Send button color: #00968c80
sub_filter_once off;

sub_filter '</head>' '<title>Tư vấn gói khám BookingCare</title><link rel="icon" type="image/svg+xml" href="/logo_bookingcare.svg"/><style>div.mb-2.flex > div.size-10.shrink-0, div.max-w-180.grow.gap-4 > span { display: none !important; } div.p-3 > div.shrink-0 > span.border-divider-regular { font-size: 0 !important; color: transparent !important; background-color: #F0F9FF !important; background-image: url("/logo_bookingcare.svg") !important; background-repeat: no-repeat !important; background-position: center !important; background-size: 72% 72% !important; } div.p-3 > div.shrink-0 > span.border-divider-regular > span { display: none !important; } div.p-3 > div.shrink-0 > span.border-divider-regular > img { content: url("/logo_bookingcare.svg") !important; object-fit: contain !important; padding: 14% !important; box-sizing: border-box !important; } .text-muted-foreground { color: #6b7280 !important; } #bc-disclaimer { pointer-events: auto !important; margin-top: 6px; } #bc-disclaimer a { text-decoration: underline !important; color: inherit !important; } div.flex.shrink-0.items-center.gap-1\.5, .system-2xs-medium-uppercase, img[alt=Dify], [data-testid="workflow-process-item"] { display: none !important; } button:has(.i-ri-send-plane-2-fill) { background-color: #00968c80 !important; border-color: #00968c80 !important; } button:has(.i-ri-send-plane-2-fill):hover:not(:disabled) { background-color: #00968c !important; border-color: #00968c !important; } [data-testid="more-container"] { display: none !important; }</style><script>(function(){var TITLE="Tư vấn gói khám BookingCare";function lockTitleAndFavicon(){if(document.title!==TITLE){document.title=TITLE;}var titles=document.getElementsByTagName("title");for(var i=0;i<titles.length;i++){if(titles[i].textContent!==TITLE){titles[i].textContent=TITLE;}}var links=document.querySelectorAll("link[rel*=icon]");for(var j=0;j<links.length;j++){if(links[j].getAttribute("href")!=="/logo_bookingcare.svg"){links[j].href="/logo_bookingcare.svg";links[j].type="image/svg+xml";}}}try{var desc=Object.getOwnPropertyDescriptor(Document.prototype,"title")||Object.getOwnPropertyDescriptor(HTMLDocument.prototype,"title");if(desc&&desc.set){var origSet=desc.set;Object.defineProperty(document,"title",{get:function(){return TITLE;},set:function(){origSet.call(document,TITLE);}});}}catch(e){}lockTitleAndFavicon();try{var obs=new MutationObserver(lockTitleAndFavicon);obs.observe(document.documentElement,{childList:true,subtree:true,characterData:true});}catch(e){}setInterval(lockTitleAndFavicon,100);})();</script></head>';

sub_filter '</body>' '<script>(function(){function updateUI(){if(!document.getElementById("bc-disclaimer")){var f=document.querySelector("[data-testid=chat-footer] > div")||document.querySelector("[data-testid=chat-footer]");if(f){var d=document.createElement("div");d.id="bc-disclaimer";d.innerHTML=`<p class="px-3 text-center text-xs text-muted-foreground">Không nên tự ý áp dụng kiến thức y khoa, cần tham khảo ý kiến của bác sĩ. <a class="underline" href="https://bookingcare.vn/thong-tin/quyen-rieng-tu-cho-tinh-nang-tro-ly-ai-tren-bookingcare-p96" rel="noreferrer" target="_blank">Quyền riêng tư</a></p>`;f.appendChild(d);}}var iconImg=document.querySelector("div.p-3 > div.shrink-0 > span.border-divider-regular > img");if(iconImg&&iconImg.getAttribute("src")!=="/logo_bookingcare.svg"){iconImg.src="/logo_bookingcare.svg";}var difyBrands=document.querySelectorAll("img[alt=Dify], .system-2xs-medium-uppercase");for(var i=0;i<difyBrands.length;i++){var p=difyBrands[i].closest("div.flex")||difyBrands[i].parentElement;if(p){p.style.setProperty("display","none","important");}}var sendBtns=document.querySelectorAll("button:has(.i-ri-send-plane-2-fill), .i-ri-send-plane-2-fill");for(var k=0;k<sendBtns.length;k++){var b=sendBtns[k].tagName==="BUTTON"?sendBtns[k]:sendBtns[k].closest("button");if(b){b.style.setProperty("background-color","#00968c80","important");b.style.setProperty("border-color","#00968c80","important");}}}setInterval(updateUI,300);})();</script></body>';

sub_filter '<title>Dify</title>' '<title>Tư vấn gói khám BookingCare</title>';
sub_filter '"children":"Dify"' '"children":"Tư vấn gói khám BookingCare"';
sub_filter '\\"children\\":\\"Dify\\"' '\\"children\\":\\"Tư vấn gói khám BookingCare\\"';
sub_filter '"href":"/favicon.ico"' '"href":"/logo_bookingcare.svg"';
sub_filter '\\"href\\":\\"/favicon.ico\\"' '\\"href\\":\\"/logo_bookingcare.svg\\"';
sub_filter '<link rel="icon" href="/favicon.ico"/>' '<link rel="icon" type="image/svg+xml" href="/logo_bookingcare.svg"/>';
